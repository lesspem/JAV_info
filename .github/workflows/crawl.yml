name: crawl-and-merge

# 定时爬取维基/xslist 数据并合并到 dist/，自动提交
on:
  # 每周一 UTC 18:00（北京时间周二 02:00）自动跑
  schedule:
    - cron: '0 18 * * 1'
  # 也可手动触发
  workflow_dispatch:
    inputs:
      force:
        description: '强制全量重抓（忽略已有 auto 缓存）'
        type: boolean
        default: false

# 需要写权限才能 push 回仓库
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            node scripts/crawl.js --force
          else
            node scripts/crawl.js
          fi

      - name: Rebuild all outputs
        run: |
          node scripts/report.js
          node scripts/build-html.js
          node scripts/build-editor.js
          node scripts/merge.js
          node scripts/export-csv.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: 自动更新数据 $(date -u +%Y-%m-%d)"
            git push
          fi
