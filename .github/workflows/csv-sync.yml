name: csv-sync

# 在 GitHub 网页上直接编辑 data/edit.csv 后，自动导入到 manual/ 并重新生成所有产物
on:
  push:
    paths:
      - 'data/edit.csv'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # 跳过机器人自己产生的提交，避免死循环
    if: "!contains(github.event.head_commit.message, 'chore: CSV 同步')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import CSV to manual/
        run: node scripts/import-csv.js

      - name: Rebuild all outputs
        run: |
          node scripts/report.js
          node scripts/build-html.js
          node scripts/merge.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "CSV 与现有数据一致，无需变更"
          else
            git commit -m "chore: CSV 同步 $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
