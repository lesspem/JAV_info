name: rebuild

# 手改 manual/、上传头像 assets/ 后触发：重新生成所有产物（报告+网页+分片）
on:
  push:
    paths:
      - 'manual/**'
      - 'auto/**'
      - 'assets/avatars/**'
      - 'scripts/**'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 跳过机器人自己产生的提交，避免死循环
    if: "!contains(github.event.head_commit.message, 'chore: 自动重建') && !contains(github.event.head_commit.message, 'chore: CSV 同步')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild all
        run: |
          node scripts/report.js
          node scripts/build-html.js
          node scripts/build-editor.js
          node scripts/merge.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore: 自动重建 $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi

